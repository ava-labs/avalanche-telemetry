name: Test and release

# ref. https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

permissions: {}

jobs:
  static_analysis:
    permissions:
      contents: read
    name: Static analysis (lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt --component clippy
          rustup override set nightly

      - name: Check Rust version
        run: rustc --version

      - uses: Swatinem/rust-cache@81d053bdb0871dcd3f10763c8cc60d0adc41762b # v1
        with:
          cache-on-failure: true

      - name: Run static analysis tests
        shell: bash
        run: scripts/tests.lint.sh

  check_cargo_unused:
    permissions:
      contents: read
    name: Check Cargo unused
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt --component clippy
          rustup override set nightly

      - name: Check Rust version
        run: rustc --version

      - uses: Swatinem/rust-cache@81d053bdb0871dcd3f10763c8cc60d0adc41762b # v1
        with:
          cache-on-failure: true

      - name: Check unused Cargo dependencies
        shell: bash
        run: scripts/tests.unused.sh

  unit_tests:
    permissions:
      contents: read
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable

      - name: Check Rust version
        run: rustc --version

      - uses: Swatinem/rust-cache@81d053bdb0871dcd3f10763c8cc60d0adc41762b # v1
        with:
          cache-on-failure: true

      - name: Run unit tests
        run: scripts/tests.unit.sh

  release:
    permissions:
      contents: write
    name: Release ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    needs: [static_analysis, check_cargo_unused, unit_tests]
    strategy:
      matrix:
        job:
          # use the same OS version as EC2/cloud host
          # otherwise, it can fail with:
          # error while loading shared libraries: libssl.so.3: cannot open shared object file: No such file or directory
          # ref. https://github.com/sfackler/rust-openssl/issues/1748
          # ref. https://doc.rust-lang.org/nightly/rustc/platform-support.html
          - os: ubuntu-20.04
            platform: linux
            target: x86_64-unknown-linux-gnu

          # https://github.com/sharkdp/fd/blob/master/.github/workflows/CICD.yml
          #
          # may require manual builds without cross-linker for linux
          # https://users.rust-lang.org/t/cant-cross-compile-project-with-openssl/70922
          - os: ubuntu-20.04
            platform: linux
            target: aarch64-unknown-linux-gnu
            use-cross: true

          - os: macos-latest
            platform: darwin
            target: x86_64-apple-darwin

          - os: macos-latest
            platform: darwin
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          persist-credentials: false

      # https://github.com/sharkdp/fd/blob/master/.github/workflows/CICD.yml
      # https://github.com/cross-rs/cross/wiki/Recipes#openssl
      - name: Install OS dependencies
        shell: bash
        run: |
          case ${{ matrix.job.target }} in
            arm-unknown-linux-*) sudo apt-get -y update ; sudo apt-get -y install gcc-arm-linux-gnueabihf ;;
            aarch64-unknown-linux-gnu) sudo apt-get -y update ; sudo apt-get -y install gcc-aarch64-linux-gnu ;;
          esac

      - name: Install Rust
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.job.target }}
        run: |
          rustup toolchain install stable --profile minimal --target "${RUST_TARGET}"
          rustup override set stable

      - name: Show version information (Rust, cargo, GCC)
        shell: bash
        run: |
          gcc --version || true
          rustup -V
          rustup toolchain list
          rustup default
          cargo -V
          rustc -V

      - name: Set cargo cmd
        shell: bash
        run: echo "CARGO_CMD=cargo" >> $GITHUB_ENV

      - name: Set cargo cmd to cross
        shell: bash
        if: ${{ matrix.job.use-cross == true }}
        run: echo "CARGO_CMD=cross" >> $GITHUB_ENV

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.job.os }}-${{ matrix.job.target }}

      - name: Install cross
        if: ${{ matrix.job.use-cross == true }}
        run: cargo install cross

      - name: Build
        run: ${{ env.CARGO_CMD }} build --release --target=${{ matrix.job.target }} --bin avalanche-telemetry-cloudwatch

      - name: Compress binaries
        id: release_artifacts
        env:
          PLATFORM_NAME: ${{ matrix.job.platform }}
          TARGET: ${{ matrix.job.target }}
        shell: bash
        run: |
          if [ "$PLATFORM_NAME" == "linux" ]; then

            cp ./target/${TARGET}/release/avalanche-telemetry-cloudwatch avalanche-telemetry-cloudwatch.${TARGET}
            echo "file_name_avalanche_telemetry_cloudwatch=avalanche-telemetry-cloudwatch.${TARGET}" >> $GITHUB_OUTPUT
            tar -czvf avalanche-telemetry-cloudwatch.${TARGET}.tar.gz -C ./target/${TARGET}/release avalanche-telemetry-cloudwatch
            echo "file_name_avalanche_telemetry_cloudwatch_tar_gz=avalanche-telemetry-cloudwatch.${TARGET}.tar.gz" >> $GITHUB_OUTPUT

          elif [ "$PLATFORM_NAME" == "darwin" ]; then

            cp ./target/${TARGET}/release/avalanche-telemetry-cloudwatch avalanche-telemetry-cloudwatch.${TARGET}
            echo "file_name_avalanche_telemetry_cloudwatch=avalanche-telemetry-cloudwatch.${TARGET}" >> $GITHUB_OUTPUT
            gtar -czvf avalanche-telemetry-cloudwatch.${TARGET}.tar.gz -C ./target/${TARGET}/release avalanche-telemetry-cloudwatch
            echo "file_name_avalanche_telemetry_cloudwatch_tar_gz=avalanche-telemetry-cloudwatch.${TARGET}.tar.gz" >> $GITHUB_OUTPUT

          else

            echo "skipping $PLATFORM_NAME"

          fi

      # release tip from latest commits
      # https://github.com/softprops/action-gh-release
      # https://docs.github.com/en/actions/learn-github-actions/contexts#github-context
      - name: Release latest
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: latest
          RELEASE_NAME: Latest release
          RELEASE_BODY: Latest builds from the last commit.
          RELEASE_FILES: |
            ${{ steps.release_artifacts.outputs.file_name_avalanche_telemetry_cloudwatch }}
            ${{ steps.release_artifacts.outputs.file_name_avalanche_telemetry_cloudwatch_tar_gz }}
        run: |
          set -eo pipefail
          files=()
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            for f in $pattern; do
              [ -e "$f" ] || { echo "::error::No file matches ${pattern}"; exit 1; }
              files+=("$f")
            done
          done <<< "${RELEASE_FILES}"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --title "${RELEASE_NAME}" --notes "${RELEASE_BODY}" --draft=false --prerelease=false
            if [ ${#files[@]} -gt 0 ]; then
              gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
            fi
          else
            gh release create "${RELEASE_TAG}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "${RELEASE_NAME}" --notes "${RELEASE_BODY}"
          fi

      # release only for tags
      # https://github.com/softprops/action-gh-release
      # https://docs.github.com/en/actions/learn-github-actions/contexts#github-context
      - name: Release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NAME: ${{ github.ref_name }}
          RELEASE_BODY: Release builds for ${{ github.ref_name }}.
          RELEASE_FILES: |
            ${{ steps.release_artifacts.outputs.file_name_avalanche_telemetry_cloudwatch }}
            ${{ steps.release_artifacts.outputs.file_name_avalanche_telemetry_cloudwatch_tar_gz }}
        run: |
          set -eo pipefail
          files=()
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            for f in $pattern; do
              [ -e "$f" ] || { echo "::error::No file matches ${pattern}"; exit 1; }
              files+=("$f")
            done
          done <<< "${RELEASE_FILES}"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --title "${RELEASE_NAME}" --notes "${RELEASE_BODY}" --draft=false --prerelease=false
            if [ ${#files[@]} -gt 0 ]; then
              gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
            fi
          else
            gh release create "${RELEASE_TAG}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "${RELEASE_NAME}" --notes "${RELEASE_BODY}"
          fi
